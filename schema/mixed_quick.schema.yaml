# Rime schema: Mixed Chinese Keyboard Plus (Quick/Cangjie + English words)
# Dictionaries are generated by ../convert.py.
---
schema:
  schema_id: mixed_quick
  name: 混合速成
  version: "0.1"
  description: |
    Mixed Chinese Keyboard Plus dictionaries (v2.1), candidate order as in
    the Android app; learns from what you pick.
  dependencies:
    - mixed_eng      # builds mixed_eng.dict.yaml for the english translator

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]

engine:
  processors:
    - lua_processor@*mixed_paging    # space, see mixed/space; lua/mixed_paging.lua
    - lua_processor@*mixed_predict   # associated phrases, lua/mixed_predict.lua
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - table_translator
    - table_translator@english
  filters:
    - lua_filter@*mixed_radicals     # Cangjie radicals as a candidate; lua/mixed_radicals.lua

# Read by lua/mixed_paging.lua, mixed_predict.lua and mixed_radicals.lua.
# Change them in mixed_quick.custom.yaml (see README, "Settings"), not here.
mixed:
  space: page                   # page: next page, wraps; first: commit the
                                # first candidate; raw: commit the letters + space
  associated_phrases: true      # suggestions after a commit
  cangjie_hint: true            # after a character typed by another code: 〔我 竹手戈〕
  radical_candidate: 1          # position of the radicals candidate (hqi: 竹手戈); 0 = off

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " ;"

# Chinese: mixed_quick.dict.yaml
translator:
  dictionary: mixed_quick
  enable_charset_filter: false
  enable_sentence: false
  enable_completion: true       # "bac" also lists back*, background ...
  enable_user_dict: true        # picked candidates move forward
  enable_encoder: false
  encode_commit_history: false
  initial_quality: 1
  # input line shows the radicals after the letters: "hqi 竹手戈"
  # (off: translator/preedit_format: [] in mixed_quick.custom.yaml)
  preedit_format:
    - 'xform/^([a-z]+)$/\U$1\E $1/'
    - xlit/abcdefghijklmnopqrstuvwxyz/日月金木水火土竹戈十大中一弓人心手口尸廿山女田難卜重/
    - 'xform/([A-Z]+)/\L$1/'

# English words: mixed_eng.dict.yaml, ranked below Chinese
english:
  dictionary: mixed_eng
  enable_sentence: false
  enable_completion: true
  enable_user_dict: true
  initial_quality: 0

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
